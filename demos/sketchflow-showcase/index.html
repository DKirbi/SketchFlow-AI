<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SketchFlow Showcase</title>
    <script>
      (function () {
        try {
          var p = new URLSearchParams(location.search);
          var t = p.get('theme');
          if (t === 'dark' || t === 'light') {
            document.documentElement.dataset.theme = t;
            document.documentElement.classList.toggle('dark', t === 'dark');
            document.documentElement.style.colorScheme = t;
          }
          var l = p.get('locale');
          if (l === 'en' || l === 'de' || l === 'sl') {
            document.documentElement.lang = l;
          }
          // Keep in sync with HOST_TOP_BAR_PX — Work top bar is 54px.
          var hostBar = p.get('hostBar');
          var barPx =
            hostBar && /^\d+$/.test(hostBar)
              ? hostBar
              : window.parent !== window
                ? '54'
                : '0';
          document.documentElement.style.setProperty('--hub-host-bar-height', barPx + 'px');
          var vis =
            (window.visualViewport && window.visualViewport.height) || window.innerHeight;
          document.documentElement.style.setProperty(
            '--hub-shell-height',
            Math.max(0, Math.round(vis - Number(barPx))) + 'px',
          );
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
