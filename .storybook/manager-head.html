<script>
  (function () {
    try {
      function param(name) {
        var own = new URLSearchParams(location.search).get(name);
        if (own) return own;
        if (parent !== window) {
          try {
            return new URLSearchParams(parent.location.search).get(name);
          } catch (e) {}
        }
        return null;
      }
      var t = param('theme');
      if (t === 'dark' || t === 'light') {
        document.documentElement.dataset.theme = t;
        document.documentElement.classList.toggle('dark', t === 'dark');
        document.documentElement.style.colorScheme = t;
      }
      var l = param('locale');
      if (l === 'en' || l === 'de' || l === 'sl') {
        document.documentElement.lang = l;
      }
    } catch (e) {}
  })();
</script>
